<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  body {
    background: linear-gradient(135deg, #eef2ff 0%, #f8f9fa 60%, #e0f7fa 100%);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .navbar-brand i { color: #6366f1; }
  .card-soft { border: none; border-radius: 1rem; box-shadow: 0 4px 16px rgba(99,102,241,.1); }
  .memo-card {
    border: none;
    border-radius: 1rem;
    border-left: 4px solid #6366f1;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .memo-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.1); }
  .memo-text { white-space: pre-wrap; word-break: break-word; }
  .btn-primary { background-color: #6366f1; border-color: #6366f1; }
  .btn-primary:hover { background-color: #4f46e5; border-color: #4f46e5; }
  .nav-tabs .nav-link.active { color: #4f46e5; }
  .empty-state { color: #94a3b8; padding: 3rem 0; }
  .empty-state i { font-size: 3rem; }
</style>
</head>
<body>

<!-- ====== 설정: 아래 두 값을 Supabase 프로젝트 값으로 바꾸세요 ====== -->
<script>
  const SUPABASE_URL = "https://dpkaxiigtvubkmsqohfp.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_7PAgF9Ba3lf1pGzC19f5LA_MRCH4tWG";
</script>

<nav class="navbar bg-white shadow-sm sticky-top">
  <div class="container" style="max-width: 760px;">
    <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
      <i class="bi bi-journal-text"></i> 메모
    </span>
    <div id="userArea" class="d-none align-items-center gap-2">
      <small class="text-secondary" id="userEmail"></small>
      <button id="logoutBtn" class="btn btn-sm btn-outline-secondary" type="button">
        <i class="bi bi-box-arrow-right me-1"></i>로그아웃
      </button>
    </div>
  </div>
</nav>

<main class="container py-4" style="max-width: 760px;">

  <!-- 로그인 / 회원가입 -->
  <section id="authSection" class="card card-soft">
    <div class="card-body p-4">
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
          <button class="nav-link active" data-mode="login" type="button">로그인</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-mode="signup" type="button">회원가입</button>
        </li>
      </ul>
      <form id="authForm">
        <div class="mb-3">
          <label class="form-label" for="email">이메일</label>
          <input type="email" id="email" class="form-control" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">비밀번호 (6자 이상)</label>
          <input type="password" id="password" class="form-control" minlength="6" required autocomplete="current-password">
        </div>
        <div id="authMsg" class="small mb-3"></div>
        <button type="submit" id="authSubmit" class="btn btn-primary w-100">로그인</button>
      </form>
    </div>
  </section>

  <!-- 메모 영역 (로그인 후 표시) -->
  <section id="appSection" class="d-none">
    <div class="card card-soft mb-4">
      <div class="card-body">
        <form id="memoForm">
          <textarea id="memoInput" class="form-control border-0 bg-light mb-3" rows="3"
                    placeholder="무슨 생각을 하고 계신가요? (Ctrl+Enter 추가)" required></textarea>
          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-plus-lg me-1"></i>추가
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="input-group mb-4">
      <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
      <input type="search" id="searchInput" class="form-control border-start-0" placeholder="메모 검색">
    </div>

    <div id="memoList"></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const authSection = $("authSection");
  const appSection = $("appSection");
  const userArea = $("userArea");
  const userEmail = $("userEmail");
  const authForm = $("authForm");
  const authMsg = $("authMsg");
  const authSubmit = $("authSubmit");
  const emailInput = $("email");
  const pwInput = $("password");
  const memoForm = $("memoForm");
  const memoInput = $("memoInput");
  const searchInput = $("searchInput");
  const list = $("memoList");

  let mode = "login";
  let memos = [];

  /* ---------- 로그인 / 회원가입 탭 ---------- */
  document.querySelectorAll("[data-mode]").forEach(btn => {
    btn.addEventListener("click", () => {
      mode = btn.dataset.mode;
      document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("active", b === btn));
      authSubmit.textContent = mode === "login" ? "로그인" : "회원가입";
      pwInput.autocomplete = mode === "login" ? "current-password" : "new-password";
      authMsg.textContent = "";
    });
  });

  authForm.addEventListener("submit", async e => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = pwInput.value;

    authSubmit.disabled = true;
    authMsg.className = "small mb-3 text-secondary";
    authMsg.textContent = "처리 중입니다...";

    const result = mode === "login"
      ? await sb.auth.signInWithPassword({ email, password })
      : await sb.auth.signUp({ email, password });

    authSubmit.disabled = false;

    if (result.error) {
      authMsg.className = "small mb-3 text-danger";
      authMsg.textContent = result.error.message;
      return;
    }

    // 이메일 확인이 켜져 있으면 세션이 바로 생기지 않습니다.
    if (mode === "signup" && !result.data.session) {
      authMsg.className = "small mb-3 text-success";
      authMsg.textContent = "가입 확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인해 주세요.";
      return;
    }

    authForm.reset();
    authMsg.textContent = "";
    // 로그인에 성공하면 onAuthStateChange가 화면을 바꿔 줍니다.
  });

  $("logoutBtn").addEventListener("click", async () => {
    await sb.auth.signOut();
  });

  /* ---------- 로그인 상태에 따라 화면 전환 ---------- */
  sb.auth.onAuthStateChange(async (_event, session) => {
    const user = session?.user ?? null;

    if (user) {
      userEmail.textContent = user.email;
      userArea.classList.remove("d-none");
      userArea.classList.add("d-flex");
      authSection.classList.add("d-none");
      appSection.classList.remove("d-none");
      await loadMemos();
    } else {
      memos = [];
      userArea.classList.add("d-none");
      userArea.classList.remove("d-flex");
      authSection.classList.remove("d-none");
      appSection.classList.add("d-none");
      render();
    }
  });

  /* ---------- 메모 데이터 (Supabase) ---------- */
  async function loadMemos() {
    const { data, error } = await sb
      .from("memos")
      .select("id, content, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      alert("메모를 불러오지 못했습니다: " + error.message);
      return;
    }
    memos = data;
    render();
  }

  memoForm.addEventListener("submit", async e => {
    e.preventDefault();
    const content = memoInput.value.trim();
    if (!content) return;

    const { data, error } = await sb
      .from("memos")
      .insert({ content })
      .select("id, content, created_at")
      .single();

    if (error) {
      alert("저장에 실패했습니다: " + error.message);
      return;
    }
    memos.unshift(data);
    memoInput.value = "";
    memoInput.focus();
    render();
  });

  memoInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) memoForm.requestSubmit();
  });

  async function deleteMemo(id) {
    if (!confirm("이 메모를 삭제할까요?")) return;

    const { error } = await sb.from("memos").delete().eq("id", id);
    if (error) {
      alert("삭제에 실패했습니다: " + error.message);
      return;
    }
    memos = memos.filter(m => m.id !== id);
    render();
  }

  /* ---------- 렌더링 ---------- */
  const pad = n => String(n).padStart(2, "0");
  function formatTime(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function render() {
    const kw = searchInput.value.trim().toLowerCase();
    const rows = memos.filter(m => !kw || m.content.toLowerCase().includes(kw));

    list.innerHTML = "";

    if (rows.length === 0) {
      list.innerHTML = `
        <div class="empty-state text-center">
          <i class="bi bi-inbox d-block mb-2"></i>
          <div>${memos.length === 0 ? "아직 메모가 없습니다." : "검색 결과가 없습니다."}</div>
        </div>`;
      return;
    }

    rows.forEach(m => {
      const card = document.createElement("div");
      card.className = "card memo-card mb-3";

      const body = document.createElement("div");
      body.className = "card-body";

      const text = document.createElement("p");
      text.className = "memo-text mb-2";
      text.textContent = m.content;

      const footer = document.createElement("div");
      footer.className = "d-flex justify-content-between align-items-center";

      const time = document.createElement("small");
      time.className = "text-secondary";
      time.innerHTML = `<i class="bi bi-clock me-1"></i>${formatTime(m.created_at)}`;

      const del = document.createElement("button");
      del.type = "button";
      del.title = "삭제";
      del.className = "btn btn-sm btn-outline-danger rounded-pill";
      del.innerHTML = '<i class="bi bi-trash"></i>';
      del.addEventListener("click", () => deleteMemo(m.id));

      footer.append(time, del);
      body.append(text, footer);
      card.appendChild(body);
      list.appendChild(card);
    });
  }

  searchInput.addEventListener("input", render);
</script>
</body>
</html>
