<!DOCTYPE html>
<html lang="ko" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  body {
    background: linear-gradient(135deg, #eef2ff 0%, #f8f9fa 60%, #e0f7fa 100%);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .navbar-brand i { color: #6366f1; }
  .memo-card {
    border: none;
    border-radius: 1rem;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    transition: transform .15s ease, box-shadow .15s ease;
    border-left: 4px solid #6366f1;
  }
  .memo-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,.1);
  }
  .memo-text { white-space: pre-wrap; word-break: break-word; }
  .composer {
    border: none;
    border-radius: 1rem;
    box-shadow: 0 4px 16px rgba(99,102,241,.12);
  }
  .btn-primary { background-color: #6366f1; border-color: #6366f1; }
  .btn-primary:hover { background-color: #4f46e5; border-color: #4f46e5; }
  .empty-state { color: #94a3b8; padding: 3rem 0; }
  .empty-state i { font-size: 3rem; }
  .fade-in { animation: fadeIn .3s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<nav class="navbar bg-white shadow-sm sticky-top">
  <div class="container" style="max-width: 760px;">
    <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
      <i class="bi bi-journal-text"></i> 메모
    </span>
    <span class="badge rounded-pill text-bg-secondary" id="count">0</span>
  </div>
</nav>

<main class="container py-4" style="max-width: 760px;">
  <!-- 작성 영역 -->
  <div class="card composer mb-4">
    <div class="card-body">
      <form id="memoForm">
        <textarea id="memoInput" class="form-control border-0 bg-light mb-3" rows="3"
                  placeholder="무슨 생각을 하고 계신가요?" required></textarea>
        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-plus-lg me-1"></i>추가
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 검색 -->
  <div class="input-group mb-4">
    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
    <input type="search" id="searchInput" class="form-control border-start-0"
           placeholder="메모 검색">
  </div>

  <!-- 목록 -->
  <div id="memoList" class="row g-3"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const STORAGE_KEY = "bootstrap-memos";
  const form = document.getElementById("memoForm");
  const input = document.getElementById("memoInput");
  const list = document.getElementById("memoList");
  const searchInput = document.getElementById("searchInput");
  const countBadge = document.getElementById("count");

  let memos = load();

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
    } catch (e) {
      alert("저장에 실패했습니다.");
    }
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function render() {
    const keyword = searchInput.value.trim().toLowerCase();
    const filtered = keyword
      ? memos.filter(m => m.text.toLowerCase().includes(keyword))
      : memos;

    countBadge.textContent = memos.length;
    list.innerHTML = "";

    if (filtered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "col-12 text-center empty-state";
      empty.innerHTML = `<i class="bi bi-inbox d-block mb-2"></i>
        <div>${keyword ? "검색 결과가 없습니다." : "아직 메모가 없습니다."}</div>`;
      list.appendChild(empty);
      return;
    }

    filtered.forEach(memo => {
      const col = document.createElement("div");
      col.className = "col-12 fade-in";

      const card = document.createElement("div");
      card.className = "card memo-card";

      const body = document.createElement("div");
      body.className = "card-body";

      const text = document.createElement("p");
      text.className = "memo-text mb-3";
      text.textContent = memo.text;

      const footer = document.createElement("div");
      footer.className = "d-flex justify-content-between align-items-center";

      const time = document.createElement("small");
      time.className = "text-secondary";
      time.innerHTML = `<i class="bi bi-clock me-1"></i>${formatTime(memo.createdAt)}`;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "btn btn-sm btn-outline-danger rounded-pill";
      del.innerHTML = `<i class="bi bi-trash"></i>`;
      del.title = "삭제";
      del.addEventListener("click", () => {
        if (!confirm("이 메모를 삭제할까요?")) return;
        memos = memos.filter(m => m.id !== memo.id);
        save();
        render();
      });

      footer.appendChild(time);
      footer.appendChild(del);
      body.appendChild(text);
      body.appendChild(footer);
      card.appendChild(body);
      col.appendChild(card);
      list.appendChild(col);
    });
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    memos.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      text,
      createdAt: Date.now()
    });
    save();
    input.value = "";
    input.focus();
    searchInput.value = "";
    render();
  });

  searchInput.addEventListener("input", render);

  render();
</script>
</body>
</html>
